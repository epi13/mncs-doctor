[package]
name = "mncs-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/epi13/mncs-doctor"
description = "MNCS repository diagnostics, automated repair, and version-aware source migration tooling."
keywords = ["mncs", "diagnostics", "migration", "refactoring", "tooling"]
categories = ["development-tools"]

[lib]
name = "mncs_doctor"
path = "src/lib.rs"

[[bin]]
name = "mncs-doctor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[profile.release]
opt-level = 2

[dev-dependencies]
# Host bridge for MNCS-core parity tests: compile policy sources
# in-process and call entrypoints with canonical ABI values.
# Pinned to a verified mncs-language rev; see docs/RUST-BOUNDARY-AUDIT.md.
mncs-embed = { git = "https://github.com/epi13/mncs-language", rev = "85051d2a44db77133e831c7cca30eba67123a60b" }
